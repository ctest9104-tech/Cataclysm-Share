<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATACLYSM ARCADE — RISE FROM THE RUINS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF6D23;--red:#CC1100;--bg:#080604;--dark:#0d0a07;
  --cr:#F0EAD6;--ge:#00FF41;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cr)}

/* OVERLAYS */
#grain{position:fixed;inset:0;pointer-events:none;z-index:500;opacity:.08;mix-blend-mode:overlay}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:499;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:498;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.78) 100%)}
#fov{position:fixed;inset:0;pointer-events:none;z-index:600;opacity:0;background:#fff}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:12px 20px;z-index:400;pointer-events:none}
#rec{display:flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;
  font-size:10px;color:rgba(255,109,35,.65);letter-spacing:.15em}
#rdot{width:7px;height:7px;border-radius:50%;background:#FF3030;animation:rdBlink 1.4s step-end infinite}
@keyframes rdBlink{0%,100%{opacity:1}50%{opacity:0}}
#hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#ts{font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,109,35,.45);letter-spacing:.1em}
#sl{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(106,96,88,.65);letter-spacing:.2em}

/* PROGRESS */
#pt{position:fixed;bottom:42px;left:0;right:0;height:2px;background:rgba(255,109,35,.1);z-index:400}
#pf{height:100%;background:var(--or);box-shadow:0 0 8px var(--or);width:0%;transition:width .1s linear}

/* CONTROLS */
#ctrl{position:fixed;bottom:0;left:0;right:0;height:40px;display:flex;align-items:center;
  justify-content:center;gap:14px;background:rgba(8,6,4,.92);
  border-top:1px solid rgba(255,109,35,.1);z-index:400;padding:0 16px}
.cb{background:transparent;border:1px solid rgba(255,109,35,.3);color:rgba(255,109,35,.7);
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;padding:5px 14px;cursor:pointer;transition:all .18s}
.cb:hover{background:rgba(255,109,35,.15);color:var(--or);border-color:var(--or)}
#dots{display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,109,35,.2);cursor:pointer;transition:all .2s}
.dot.on{background:var(--or);box-shadow:0 0 6px var(--or)}
.dot:hover{background:rgba(255,109,35,.55)}

#stage{width:100%;height:100vh;position:relative;overflow:hidden}

/* SHARED KEYFRAMES */
@keyframes riseUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleSlam{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes barSlide{to{transform:scaleX(1)}}
@keyframes cardFlip{to{transform:rotateY(0) scale(1);opacity:1}}
@keyframes packReveal{from{opacity:0;transform:translateY(18px) rotate(-4deg)}to{opacity:1;transform:translateY(0) rotate(-3deg)}}
@keyframes packFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(0deg)}}
@keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}}
@keyframes noiseBurst{0%{opacity:.9;filter:brightness(3) saturate(0)}35%{opacity:.4}70%{opacity:.1}100%{opacity:0}}
@keyframes bootReveal{to{opacity:1}}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes btnGlow{0%,100%{box-shadow:0 0 12px rgba(255,109,35,.5)}50%{box-shadow:0 0 35px rgba(255,109,35,.9),0 0 70px rgba(255,109,35,.35)}}

/* ── BOOT ── */
.s-boot{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;background:var(--bg)}
.bl{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--ge);text-shadow:0 0 8px var(--ge);line-height:2.1;opacity:0;animation:bootReveal .05s ease forwards}
.cursor-blink{display:inline-block;width:9px;height:14px;background:var(--ge);vertical-align:text-bottom;box-shadow:0 0 6px var(--ge);animation:cursorBlink .7s step-end infinite}

/* ── TITLE ── */
.s-title{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative}
.t-glow{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 46%,rgba(255,109,35,.09) 0%,transparent 65%),var(--bg)}
.t-burst{position:absolute;inset:0;background:#fff;opacity:0;animation:noiseBurst .85s ease-out forwards}
.t-wrap{position:relative;z-index:2;text-align:center;padding:24px}
.t-presenter{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.55em;color:rgba(255,109,35,.5);opacity:0;animation:riseUp .6s ease 1.0s forwards}
.t-rule{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--or),transparent);margin:14px auto;opacity:0;animation:riseUp .4s ease 1.2s forwards}
.t-main{font-family:'Black Ops One',cursive;font-size:clamp(52px,11vw,128px);line-height:.87;letter-spacing:.03em;color:var(--cr);text-shadow:5px 5px 0 var(--red),7px 7px 0 rgba(180,10,0,.4),0 0 45px rgba(255,109,35,.22);opacity:0;transform:scale(.35) translateY(30px);animation:titleSlam .55s cubic-bezier(.05,.7,.25,1) .7s forwards}
.t-sub{font-family:'Bebas Neue',cursive;font-size:clamp(18px,3.6vw,42px);letter-spacing:.48em;color:var(--or);margin-top:14px;opacity:0;animation:riseUp .6s ease 1.4s forwards}
.t-tag{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.25em;color:rgba(106,96,88,.75);margin-top:18px;opacity:0;animation:riseUp .5s ease 1.8s forwards}

/* ── WORLD ── */
.s-world{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.w-bg{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,6,4,.18) 0%,rgba(8,6,4,.72) 80%),url('https://play.cataclysmarcade.com/cdn/shop/files/Give_the_Signal_Final.webp') center/cover no-repeat;filter:saturate(.65) contrast(1.1)}
.w-grad{position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 0%,transparent 22%,transparent 78%,var(--bg) 100%)}
.w-c{position:relative;z-index:2;max-width:640px;text-align:center;padding:24px}
.w-era{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.5em;color:var(--or);border:1px solid rgba(255,109,35,.35);padding:7px 20px;display:inline-block;margin-bottom:26px;opacity:0;animation:riseUp .5s ease .3s forwards}
.w-title{font-family:'Black Ops One',cursive;font-size:clamp(32px,5.6vw,66px);line-height:1.04;color:var(--cr);margin-bottom:22px;opacity:0;animation:riseUp .6s ease .7s forwards}
.w-title .ac{color:var(--or)}
.w-div{width:58px;height:2px;background:var(--or);margin:0 auto 22px;opacity:0;animation:riseUp .4s ease .9s forwards}
.w-body{font-family:'Share Tech Mono',monospace;font-size:12.5px;line-height:1.92;color:rgba(240,234,214,.62);max-width:490px;margin:0 auto;opacity:0;animation:riseUp .6s ease 1.1s forwards}

/* ── FACTIONS ── */
.s-factions{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at center,rgba(30,22,12,1) 0%,var(--bg) 100%);padding:54px 16px 50px;overflow:hidden}
.f-hdr{font-family:'Bebas Neue',cursive;font-size:clamp(14px,2.3vw,28px);letter-spacing:.58em;color:var(--or);opacity:0;animation:riseUp .5s ease .1s forwards}
.f-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:min(860px,95vw);width:100%}
.fc{aspect-ratio:3/4;position:relative;border-radius:8px;overflow:hidden;border:1px solid rgba(255,109,35,.14);background:var(--dark);box-shadow:0 24px 48px rgba(0,0,0,.9);max-height:calc(100vh - 300px);transform:rotateY(90deg) scale(.85);opacity:0;animation:cardFlip .65s cubic-bezier(.2,.85,.35,1) both;cursor:pointer;transition:transform .3s,box-shadow .3s}
.fc:nth-child(1){animation-delay:.25s}
.fc:nth-child(2){animation-delay:.52s}
.fc:nth-child(3){animation-delay:.78s}
.fc:nth-child(4){animation-delay:1.04s}
.fc:hover{transform:scale(1.05) translateY(-7px);box-shadow:0 0 0 1px rgba(255,109,35,.5),0 0 28px rgba(255,109,35,.22),0 30px 60px rgba(0,0,0,.9)}
.fc img{width:100%;height:100%;object-fit:cover;display:block}
.f-ov{position:absolute;bottom:0;left:0;right:0;padding:28px 12px 12px;background:linear-gradient(to top,rgba(8,6,4,.97) 0%,rgba(8,6,4,.6) 60%,transparent 100%)}
.f-name{font-family:'Black Ops One',cursive;font-size:12.5px;letter-spacing:.08em;line-height:1.2}
.f-name.sy{color:var(--or);text-shadow:0 0 10px rgba(255,109,35,.55)}
.f-name.sh{color:#4A9EE8;text-shadow:0 0 10px rgba(74,158,232,.55)}
.f-name.my{color:#9B59B6;text-shadow:0 0 10px rgba(155,89,182,.55)}
.f-name.su{color:#76C442;text-shadow:0 0 10px rgba(118,196,66,.55)}
.f-desc{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(106,96,88,.88);line-height:1.5;margin-top:5px}

/* APEX REVEAL */
@keyframes apexFogReveal{
  0%{opacity:0;filter:blur(14px)}
  100%{opacity:1;filter:blur(0)}
}
@keyframes apexPulse{
  0%,100%{text-shadow:0 0 60px rgba(139,0,0,.95),0 0 120px rgba(100,0,0,.55),0 0 200px rgba(55,0,0,.28)}
  50%{text-shadow:0 0 35px rgba(190,0,0,1),0 0 72px rgba(155,0,0,.72),0 0 120px rgba(100,0,0,.46),0 0 10px rgba(255,30,0,.38)}
}
.f-apex-wrap{width:100%;text-align:center;position:relative;flex-shrink:0;opacity:0;animation:apexFogReveal 1.8s ease-out 2.8s forwards;will-change:filter,opacity}
.f-apex-lbl{font-family:'Share Tech Mono',monospace;font-size:7.5px;letter-spacing:.55em;color:rgba(139,0,0,.45);margin-bottom:4px;text-transform:uppercase}
.f-apex-t{font-family:'Black Ops One',cursive;font-size:clamp(50px,9.5vw,112px);letter-spacing:.32em;color:#780000;text-shadow:0 0 60px rgba(139,0,0,.95),0 0 120px rgba(100,0,0,.55),0 0 200px rgba(55,0,0,.28);line-height:1;animation:apexPulse 3.5s ease-in-out 6s infinite}
.f-apex-rule{width:150px;height:1px;background:linear-gradient(90deg,transparent,rgba(139,0,0,.45),transparent);margin:8px auto 0;opacity:0;animation:riseUp .6s ease 5.8s forwards}

/* ── GAMEPLAY ── */
.s-gameplay{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.g-bg{position:absolute;inset:0;opacity:.45;background:linear-gradient(to right,var(--bg) 0%,rgba(8,6,4,.55) 28%,rgba(8,6,4,.55) 72%,var(--bg) 100%),url('https://play.cataclysmarcade.com/cdn/shop/files/MODULE_15.webp?crop=center&height=1269&width=2943') center/cover no-repeat}
.g-c{position:relative;z-index:2;max-width:800px;width:90%;text-align:center}
.g-title{font-family:'Black Ops One',cursive;font-size:clamp(28px,5vw,56px);color:var(--cr);line-height:1;margin-bottom:28px;opacity:0;animation:riseUp .5s ease .3s forwards}
.g-title em{color:var(--or);font-style:normal}
.mechs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.mech{border:1px solid rgba(255,109,35,.18);padding:15px;text-align:left;background:rgba(13,10,7,.62);position:relative;opacity:0;animation:riseUp .5s ease both}
.mech::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--or);transform:scaleX(0);transform-origin:left;animation:barSlide .5s ease both}
.mech:nth-child(1){animation-delay:.5s}.mech:nth-child(1)::before{animation-delay:.6s}
.mech:nth-child(2){animation-delay:.7s}.mech:nth-child(2)::before{animation-delay:.8s}
.mech:nth-child(3){animation-delay:.9s}.mech:nth-child(3)::before{animation-delay:1.0s}
.mech:nth-child(4){animation-delay:1.1s}.mech:nth-child(4)::before{animation-delay:1.2s}
.mech-ico{font-size:22px;margin-bottom:8px;display:block}
.mech-t{font-family:'Bebas Neue',cursive;font-size:19px;letter-spacing:.1em;color:var(--or);margin-bottom:5px}
.mech-b{font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(106,96,88,.88);line-height:1.6}
.ctags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;animation:riseUp .5s ease 1.3s forwards}
.ctag{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.3em;padding:5px 14px;border:1px solid}
.ctag.boss{color:#FFD700;border-color:rgba(255,215,0,.45)}
.ctag.fighter{color:var(--or);border-color:rgba(255,109,35,.45)}
.ctag.tactic{color:#9B59B6;border-color:rgba(155,89,182,.45)}
.ctag.weapon{color:#76C442;border-color:rgba(118,196,66,.45)}

/* ── PACK ── */
.s-pack{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,rgba(30,16,4,1) 0%,var(--bg) 65%)}
.p-ring{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,109,35,.14) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:ringPulse 2.6s ease-in-out infinite}
.p-flex{position:relative;z-index:2;display:flex;align-items:center;gap:52px;padding:28px;flex-wrap:wrap;justify-content:center}
.p-img{height:min(340px,42vw);filter:drop-shadow(0 0 35px rgba(255,109,35,.44));opacity:0;animation:packReveal .7s ease .3s forwards,packFloat 3.6s ease-in-out 1s infinite}
.p-txt{max-width:380px}
.p-head{font-family:'Black Ops One',cursive;font-size:clamp(28px,5vw,58px);line-height:.94;color:var(--cr);opacity:0;animation:riseUp .6s ease .5s forwards}
.p-head .or{color:var(--or);display:block}
.p-list{margin-top:22px;opacity:0;animation:riseUp .5s ease .9s forwards}
.p-item{font-family:'Share Tech Mono',monospace;font-size:11.5px;color:rgba(106,96,88,.88);line-height:2.05;display:flex;align-items:center;gap:10px}
.p-item::before{content:'▸';color:var(--or);flex-shrink:0}
.p-quote{margin-top:18px;font-family:'Share Tech Mono',monospace;font-size:10.5px;font-style:italic;color:rgba(200,255,0,.7);border-left:2px solid var(--or);padding-left:12px;opacity:0;animation:riseUp .5s ease 1.2s forwards}

/* ── CTA ── */
.s-cta{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.cta-bg{position:absolute;inset:0;background:url('https://play.cataclysmarcade.com/cdn/shop/files/MODULE_1_e0bfa7e3-c4b1-445a-b937-cf70042857c7.png') center/cover no-repeat;filter:saturate(.2) brightness(.24)}
.cta-ov{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,109,35,.06) 0%,rgba(8,6,4,.92) 65%)}
.cta-c{position:relative;z-index:2;text-align:center;padding:32px;max-width:800px}
.cta-ey{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.58em;color:var(--or);text-transform:uppercase;margin-bottom:18px;opacity:0;animation:riseUp .5s ease .2s forwards}
.cta-main{font-family:'Black Ops One',cursive;font-size:clamp(44px,9vw,112px);line-height:.87;color:var(--cr);text-shadow:5px 5px 0 var(--red),0 0 55px rgba(255,109,35,.18);opacity:0;animation:riseUp .6s ease .5s forwards}
.cta-main .h{color:var(--or)}
.cta-sub{font-family:'Bebas Neue',cursive;font-size:clamp(13px,2.4vw,27px);letter-spacing:.38em;color:rgba(106,96,88,.78);margin-top:10px;opacity:0;animation:riseUp .5s ease .8s forwards}
.cta-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:36px;opacity:0;animation:riseUp .5s ease 1.1s forwards}
.btn-k{font-family:'Black Ops One',cursive;font-size:15px;letter-spacing:.08em;padding:14px 36px;background:var(--or);color:var(--bg);border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .2s;animation:btnGlow 2.3s ease-in-out infinite 1.5s}
.btn-k:hover{transform:scale(1.04)}
.btn-c{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:.26em;padding:14px 36px;background:transparent;color:var(--cr);border:1px solid rgba(240,234,214,.24);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:border-color .2s,color .2s}
.btn-c:hover{border-color:var(--or);color:var(--or)}
.press-row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:30px;opacity:0;animation:riseUp .5s ease 1.4s forwards}
.pp{font-family:'Share Tech Mono',monospace;font-size:10px;font-style:italic;color:rgba(106,96,88,.78);text-align:center;max-width:210px;border-top:1px solid rgba(255,109,35,.2);padding-top:10px}
.ps{color:rgba(255,109,35,.48);font-style:normal;display:block;margin-top:5px}
</style>
</head>
<body>

<canvas id="grain"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="fov"></div>

<div id="hud">
  <div id="rec">
    <div id="rdot"></div>
    <span>REC</span>
    <span style="margin-left:6px;opacity:.4">|</span>
    <span>NYC_SUBWAY_88.6FM</span>
  </div>
  <div id="hud-r">
    <div id="ts">--:--:--</div>
    <div id="sl">01 / 07</div>
  </div>
</div>

<div id="pt"><div id="pf"></div></div>

<div id="ctrl">
  <button class="cb" id="bp">◀ PREV</button>
  <div id="dots">
    <div class="dot on" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
    <div class="dot" data-i="3"></div>
    <div class="dot" data-i="4"></div>
    <div class="dot" data-i="5"></div>
    <div class="dot" data-i="6"></div>
  </div>
  <button class="cb" id="bpa">⏸ PAUSE</button>
  <button class="cb" id="bn">NEXT ▶</button>
</div>

<div id="stage"></div>

<script>
const SCENES=[
  {key:'boot',  label:'01 / 07',dur:7000},
  {key:'title', label:'02 / 07',dur:9000},
  {key:'world', label:'03 / 07',dur:11000},
  {key:'facs',  label:'04 / 07',dur:14000},
  {key:'game',  label:'05 / 07',dur:12000},
  {key:'pack',  label:'06 / 07',dur:12000},
  {key:'cta',   label:'07 / 07',dur:Infinity},
];
const TDUR=SCENES.slice(0,-1).reduce((a,s)=>a+s.dur,0);

const TPL={
boot:()=>`<div class="s-boot">${[
  '> CATACLYSM ARCADE BROADCAST SYSTEM v2.6',
  '> NYC DEEP TRANSIT — FREQ: 88.6 FM',
  '> SCANNING FOR SIGNAL...',
  '> LOCK ESTABLISHED — STRENGTH: 94%',
  '> FACTIONS ONLINE: [SYNTH] [SHIFTER] [MYSTIC] [SURVIVOR]',
  '> GLADIATORIAL PROTOCOL: ACTIVE',
  '> INITIATING BROADCAST — STAND BY...',
  '> <span class="cursor-blink"></span>',
].map((t,i)=>`<div class="bl" style="animation-delay:${i*.55}s">${t}</div>`).join('')}</div>`,

title:()=>`<div class="s-title">
  <div class="t-glow"></div>
  <div class="t-burst"></div>
  <div class="t-wrap">
    <div class="t-presenter">MOTHERSHIP GAMES PRESENTS</div>
    <div class="t-rule"></div>
    <div class="t-main">CATACLYSM<br>ARCADE</div>
    <div class="t-rule"></div>
    <div class="t-sub">RISE FROM THE RUINS</div>
    <div class="t-tag">◆ &nbsp;CRAWLING FROM THE WRECKAGE — FIRST EDITION&nbsp; ◆</div>
  </div>
</div>`,

world:()=>`<div class="s-world">
  <div class="w-bg"></div>
  <div class="w-grad"></div>
  <div class="w-c">
    <div class="w-era">◆ &nbsp;THE YEAR IS 2026 — BUT NOT THE ONE YOU KNOW&nbsp; ◆</div>
    <div class="w-title">FORTY YEARS AFTER<br>THE <span class="ac">CATACLYSM</span></div>
    <div class="w-div"></div>

let cur=0,paused=false,timer=null,t0=Date.now();

function flash(cb){
  const el=document.getElementById('fov');
  el.style.transition='none';el.style.opacity='.92';
  setTimeout(()=>{el.style.transition='opacity .35s ease';el.style.opacity='0';if(cb)setTimeout(cb,80);},60);
}

function show(idx,withFlash=true){
  cur=Math.max(0,Math.min(SCENES.length-1,idx));
  clearTimeout(timer);
  t0=Date.now();
  const sc=SCENES[cur];
  const render=()=>{
    document.getElementById('stage').innerHTML=TPL[sc.key]();
    document.getElementById('sl').textContent=sc.label;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
    if(!paused&&sc.dur!==Infinity) timer=setTimeout(()=>show(cur+1),sc.dur);
  };
  withFlash?flash(render):render();
}

function togglePause(){
  paused=!paused;
  document.getElementById('bpa').textContent=paused?'▶ PLAY':'⏸ PAUSE';
  if(!paused){
    const rem=SCENES[cur].dur-(Date.now()-t0);
    if(SCENES[cur].dur!==Infinity&&rem>0) timer=setTimeout(()=>show(cur+1),rem);
  } else clearTimeout(timer);
}

function tick(){
  if(!paused){
    let cum=0;for(let i=0;i<cur;i++)cum+=SCENES[i].dur;
    const ins=Math.min(Date.now()-t0,SCENES[cur].dur===Infinity?0:SCENES[cur].dur);
    document.getElementById('pf').style.width=Math.min(((cum+ins)/TDUR)*100,100)+'%';
  }
  requestAnimationFrame(tick);
}

function clock(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  document.getElementById('ts').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  setTimeout(clock,1000);
}

function initGrain(){
  const c=document.getElementById('grain'),ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}resize();
  window.addEventListener('resize',resize);
  let f=0;
  function draw(){
    f++;
    if(f%2===0){
      const d=ctx.createImageData(c.width,c.height),px=d.data;
      for(let i=0;i<px.length;i+=4){const v=Math.random()*255;px[i]=px[i+1]=px[i+2]=v;px[i+3]=11;}
      ctx.putImageData(d,0,0);
    }
    requestAnimationFrame(draw);
  }draw();
}

document.getElementById('bp').onclick=()=>{if(cur>0){t0=Date.now();show(cur-1);}};
document.getElementById('bn').onclick=()=>{if(cur<SCENES.length-1){t0=Date.now();show(cur+1);}};
document.getElementById('bpa').onclick=togglePause;
document.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>{t0=Date.now();show(+d.dataset.i);}));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<SCENES.length-1){t0=Date.now();show(cur+1);}}
  if(e.key==='ArrowLeft'){if(cur>0){t0=Date.now();show(cur-1);}}
  if(e.key==='p'||e.key==='P')togglePause();
});

initGrain();clock();tick();show(0,false);
</script>
